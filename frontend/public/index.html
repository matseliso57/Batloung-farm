<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batloung Farm Distribution System</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">B</span>
      <div>
        <strong>Batloung Farm</strong>
        <small>Distribution System</small>
      </div>
    </div>
    <nav class="nav">
      <a href="#dashboard" data-page="dashboard">Dashboard</a>
      <a href="#suppliers" data-page="suppliers">Suppliers</a>
      <a href="#fruits" data-page="fruits">Fruits &amp; Stock</a>
      <a href="#vendors" data-page="vendors">Vendors</a>
      <a href="#purchases" data-page="purchases">Purchases</a>
      <a href="#sales" data-page="sales">Sales</a>
      <a href="#payments" data-page="payments">Payments</a>
      <a href="#reports" data-page="reports">Reports</a>
    </nav>
    <div class="userbox">
      <span class="userbox-label">Signed in as</span>
      <strong id="user-name">Administrator</strong>
      <button type="button" class="btn small" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div id="view"></div>
  </main>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
