<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Batloung Farm</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand login-brand">
      <span class="brand-mark">B</span>
      <div>
        <strong>Batloung Farm</strong>
        <small>Distribution System</small>
      </div>
    </div>

    <h1>Administrator sign in</h1>
    <p class="login-sub">Enter your details to manage suppliers, stock, vendors and sales.</p>

    <form id="login-form" novalidate>
      <label>Username
        <input id="username" name="username" autocomplete="username" autofocus required>
      </label>
      <label>Password
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <label class="show-pass"><input type="checkbox" id="show"> Show password</label>

      <div class="form-error" id="login-error" hidden></div>
      <button class="btn primary login-btn" type="submit" id="login-btn">Sign in</button>
    </form>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
